global:
  scrape_interval: 5s # Interval for new metrics

scrape_configs:
  # - job_name: 'ollama-engine'
  #   static_configs:
  #     # This points to existing LLM container
  #     - targets: ['ollama-server:11434'] 

    # Scrape cAdvisor for system/hardware metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Scrape custom Python exporter
  - job_name: 'ai-metrics'
    static_configs:
      - targets: ['ai-metrics:8000']

  - job_name: 'agent-metrics'
    static_configs:
      - targets: ['bazm-web-ui:8001', 'orchestrator-service:8001']