version: '3.8'

services:

# 1. The Main AI Engine
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

 # 2. The Automator (Downloads the model, then exits)
  model-puller:
    image: ollama/ollama:latest
    container_name: model-puller
    depends_on:
      - ollama-server
    environment:
      - OLLAMA_HOST=ollama-server:11434
    # Docker injects the model name from the .env file here!
    command: pull ${LLM_MODEL}
      
  # 3. The Multiagent Orchestrator 
  orchestrator:
    build: .
    container_name: orchestrator-service
    depends_on:
      model-puller:
        condition: service_completed_successfully
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - OLLAMA_BASE_URL=http://ollama-server:11434/v1

  # 4. The Web Interface
  web-ui:
    build: .
    container_name: bazm-web-ui
    depends_on:
      model-puller:
        condition: service_completed_successfully
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - OLLAMA_BASE_URL=http://ollama-server:11434/v1
    ports:
      - "8501:8501" # Streamlit's default port
    command: ["streamlit", "run", "interface/web.py", "--server.port=8501", "--server.address=0.0.0.0"]

# 5. Metrics Time-Series Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-service
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # 6. Observability Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-service
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    depends_on:
      - prometheus
    restart: unless-stopped

  # 7. System Hardware Monitor (cAdvisor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped



    
volumes:
  ollama_data:
