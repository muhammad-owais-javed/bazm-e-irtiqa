name: bazm-e-irtiqa

services:
  ollama-engine:
    image: ollama/ollama:${OLLAMA_VERSION:?set OLLAMA_VERSION in .env}
    container_name: ollama-service
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  model-puller:
    image: ollama/ollama:${OLLAMA_VERSION:?set OLLAMA_VERSION in .env}
    container_name: model-puller
    environment:
      - OLLAMA_HOST=ollama-engine:11434
      - LLM_MODELS=${LLM_MODELS:?set LLM_MODELS in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'for m in $$(echo "$$LLM_MODELS" | tr "," " "); do echo "Pulling $$m"; ollama pull "$$m" || exit 1; done'
    depends_on:
      ollama-engine:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data: