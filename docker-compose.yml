version: '3.8'

services:

# 1. The Main AI Engine
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

 # 2. The Automator (Downloads the model, then exits)
  model-puller:
    image: ollama/ollama:latest
    container_name: model-puller
    depends_on:
      - ollama-server
    environment:
      - OLLAMA_HOST=llm-server:11434
    # Docker injects the model name from the .env file here!
    command: pull ${LLM_MODEL}
      
volumes:
  ollama_data:
